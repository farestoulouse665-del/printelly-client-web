name: Background Studio CI

on:
  push:
    branches:
      - transferlab-background-studio
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker/**"
      - "docker-compose.yml"
      - ".github/workflows/background-studio-ci.yml"

permissions:
  contents: read

concurrency:
  group: background-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend, API and mask regression
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: printelly_test
          POSTGRES_USER: printelly
          POSTGRES_PASSWORD: printelly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U printelly -d printelly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://printelly:printelly_test@127.0.0.1:5432/printelly_test
      REDIS_URL: redis://127.0.0.1:6379/15
      RQ_QUEUE_NAME: background-removal-ci
      STORAGE_ROOT: ${{ runner.temp }}/printelly-objects
      TEMP_DIR: ${{ runner.temp }}/printelly-temp
      LOAD_LEGACY_MODEL: "false"
      ALLOW_VECTOR_CONVERSION: "true"
      SIGNING_SECRET: ci-signing-secret-not-for-production
      ADMIN_TOKEN: ci-admin-token-not-for-production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-base.txt
            backend/requirements.txt
      - name: Install native image libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips42 libgl1 poppler-utils librsvg2-bin
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Apply PostgreSQL migrations
        run: alembic upgrade head
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Run unit, API and regression tests
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml

  frontend:
    name: Next.js, TypeScript and browser journeys
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile end-to-end tests
        run: npm run test:e2e
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  infrastructure:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose graph
        run: docker compose config --quiet
      - name: Build API and frontend images
        run: docker compose build api frontend

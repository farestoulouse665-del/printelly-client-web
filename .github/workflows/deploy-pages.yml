name: Deploy Printelly Client Website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: printelly-client-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate website and Studio IA billing
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s manifest.webmanifest
          test -s sw.js
          test -s background-studio/index.html
          test -s studio-billing-api.js
          test -s studio-packs/index.html
          test -s studio-packs/styles.css
          test -s studio-packs/app.js
          test -s studio-admin/index.html
          test -s studio-admin/styles.css
          test -s studio-admin/app.js
          node --check app.js
          node --check background-removal-api.js
          node --check studio-billing-api.js
          node --check studio-credit-badge.js
          node --check studio-packs/app.js
          node --check studio-admin/app.js
          node --test tests/studio-pages-contract.test.mjs
          grep -Fq "jitxplfujyypfepiajgz.supabase.co" studio-billing-api.js
          if grep -Eqi "service_role|SUPABASE_SERVICE_ROLE" index.html app.js background-removal-api.js studio-billing-api.js studio-credit-badge.js studio-packs/*.html studio-packs/*.js studio-admin/*.html studio-admin/*.js; then
            echo "Privileged Supabase key detected in public frontend"
            exit 1
          fi

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Report deployment start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment --repo "${{ github.repository }}" 1 --body "PRINTELLY_WEB_STARTED run_id=${{ github.run_id }} run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment --repo "${{ github.repository }}" 1 --body "PRINTELLY_WEB_FINISHED status=${{ job.status }} run_id=${{ github.run_id }} url=${{ steps.deployment.outputs.page_url }}"

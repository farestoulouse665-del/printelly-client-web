name: Studio AI quality

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "background-*.js"
      - "background-*.css"
      - "background-studio/**"
      - "studio-*.js"
      - "studio-*.css"
      - "tools/**"
      - "supabase/**"
      - "tests/**"
      - "sw.js"
      - ".github/workflows/studio-ai-quality.yml"
  push:
    branches: [main]
    paths:
      - "background-*.js"
      - "background-*.css"
      - "background-studio/**"
      - "studio-*.js"
      - "studio-*.css"
      - "tools/**"
      - "supabase/**"
      - "tests/**"
      - "sw.js"
      - ".github/workflows/studio-ai-quality.yml"

permissions:
  contents: write

jobs:
  frontend-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:frontend
      - run: node --test tests/studio-pages-contract.test.mjs
      - name: Auditer le thème Studio AI
        run: |
          python tools/audit_studio_theme.py --json dist/studio-theme-audit.json
          python tools/check_css_contrast.py --json dist/studio-contrast-report.json
          python tools/check_studio_layout.py --json dist/studio-layout-report.json
      - name: Publier le résultat de validation
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p dist
          printf '{\n  "success": true,\n  "commit": "%s",\n  "generated_at": "%s"\n}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/studio-ai-quality-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/studio-ai-quality-status.json dist/studio-theme-audit.json dist/studio-contrast-report.json dist/studio-layout-report.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publie le rapport qualité du Studio AI"
          git push

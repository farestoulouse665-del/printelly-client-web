name: Deploy TransferLab to GitHub Pages

on:
  push:
    branches:
      - transferlab-autonome
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: transferlab-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}transferlab/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout client site from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: client-site

      - name: Checkout TransferLab branch
        uses: actions/checkout@v4
        with:
          ref: transferlab-autonome
          path: transferlab-source

      - name: Prepare combined Pages artifact
        run: |
          mkdir -p _site/transferlab
          rsync -a --exclude='.git' --exclude='.github' client-site/ _site/
          cp transferlab-source/index.html _site/transferlab/index.html
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published TransferLab site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}transferlab/
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location "$SITE_URL" | grep --quiet "TransferLab"; then
              echo "TransferLab is live at $SITE_URL"
              exit 0
            fi
            sleep 5
          done
          echo "TransferLab was not found at $SITE_URL"
          exit 1

name: Deploy TransferLab to GitHub Pages

on:
  push:
    branches:
      - transferlab-autonome
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: transferlab-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TransferLab
        uses: actions/checkout@v4

      - name: Prepare standalone site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published TransferLab site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location "$SITE_URL" | grep --quiet "TransferLab"; then
              echo "TransferLab is live at $SITE_URL"
              exit 0
            fi
            sleep 5
          done
          echo "The deployed page did not expose the expected TransferLab content."
          exit 1

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      BACKGROUND_MODEL_PATH: /models/background-removal.onnx
      BACKGROUND_MODEL_SHA256: ${BACKGROUND_MODEL_SHA256:?Set BACKGROUND_MODEL_SHA256 in .env}
      BACKGROUND_MODEL_NAME: BiRefNet-general-tiny
      BACKGROUND_DEVICE: ${BACKGROUND_DEVICE:-cpu}
      BACKGROUND_MODEL_INPUT_SIZE: ${BACKGROUND_MODEL_INPUT_SIZE:-1024}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-40000000}
      TEMP_DIR: /tmp/background-removal
      TMPDIR: /tmp/background-removal
      TEMP_TTL_SECONDS: ${TEMP_TTL_SECONDS:-900}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-1}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-300}
      TRUST_PROXY_HEADERS: "false"
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,https://farestoulouse665-del.github.io
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models:ro
    tmpfs:
      - /tmp/background-removal:size=512m,mode=1770,uid=999,gid=999
    security_opt:
      - no-new-privileges:true
    read_only: true

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    security_opt:
      - no-new-privileges:true

name: printelly-background-studio

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-printelly}
      POSTGRES_USER: ${POSTGRES_USER:-printelly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-printelly-dev-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-printelly} -d ${POSTGRES_DB:-printelly}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements.txt
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"]
    environment: &backend-environment
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-printelly}:${POSTGRES_PASSWORD:-printelly-dev-only}@postgres:5432/${POSTGRES_DB:-printelly}
      REDIS_URL: redis://redis:6379/0
      RQ_QUEUE_NAME: ${RQ_QUEUE_NAME:-background-removal}
      STORAGE_ROOT: /data/objects
      BACKGROUND_MODEL_PATH: /models/background-removal.onnx
      BACKGROUND_MODEL_SHA256: ${BACKGROUND_MODEL_SHA256:-}
      BACKGROUND_MODEL_NAME: ${BACKGROUND_MODEL_NAME:-BiRefNet-general}
      BACKGROUND_PIPELINE_VERSION: ${BACKGROUND_PIPELINE_VERSION:-printelly-birefnet-v3}
      BACKGROUND_DEVICE: ${BACKGROUND_DEVICE:-auto}
      BACKGROUND_MODEL_INPUT_SIZE: ${BACKGROUND_MODEL_INPUT_SIZE:-1024}
      BACKGROUND_PIPELINE_V2_ENABLED: ${BACKGROUND_PIPELINE_V2_ENABLED:-true}
      LOAD_LEGACY_MODEL: ${LOAD_LEGACY_MODEL:-false}
      INFERENCE_TILE_SIZE: ${INFERENCE_TILE_SIZE:-2048}
      INFERENCE_TILE_OVERLAP: ${INFERENCE_TILE_OVERLAP:-192}
      LARGE_IMAGE_THRESHOLD_PIXELS: ${LARGE_IMAGE_THRESHOLD_PIXELS:-16000000}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-150}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-120000000}
      MAX_BATCH_FILES: ${MAX_BATCH_FILES:-25}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-1}
      ALLOW_VECTOR_CONVERSION: ${ALLOW_VECTOR_CONVERSION:-true}
      DELETION_GRACE_HOURS: ${DELETION_GRACE_HOURS:-24}
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-3600}
      TEMP_DIR: /tmp/background-removal
      SIGNING_SECRET: ${SIGNING_SECRET:-development-only-change-me}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-development-admin-change-me}
      TRUST_PROXY_HEADERS: "true"
      CORS_ORIGINS: http://localhost:8080,http://localhost:3000
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-true}
      PRICE_PER_SQUARE_CM_DZD: ${PRICE_PER_SQUARE_CM_DZD:-0.55}
      MINIMUM_LINE_ITEM_DZD: ${MINIMUM_LINE_ITEM_DZD:-250}
      DEFAULT_DELIVERY_DZD: ${DEFAULT_DELIVERY_DZD:-600}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - object-data:/data/objects
      - ./models:/models:ro
    tmpfs:
      - /tmp/background-removal:size=1g,mode=1770,uid=999,gid=999
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements.txt
    restart: unless-stopped
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "background-removal", "--with-scheduler"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - object-data:/data/objects
      - ./models:/models:ro
    tmpfs:
      - /tmp/background-removal:size=2g,mode=1770,uid=999,gid=999
    read_only: true
    security_opt:
      - no-new-privileges:true

  maintenance:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements.txt
    restart: unless-stopped
    command: ["python", "-m", "app.workers.maintenance", "--loop"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - object-data:/data/objects
    tmpfs:
      - /tmp/background-removal:size=256m,mode=1770,uid=999,gid=999
    read_only: true
    security_opt:
      - no-new-privileges:true

  worker-gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements-gpu.txt
    restart: unless-stopped
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "background-removal-gpu", "--with-scheduler"]
    environment:
      <<: *backend-environment
      BACKGROUND_DEVICE: cuda
      RQ_QUEUE_NAME: background-removal-gpu
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - object-data:/data/objects
      - ./models:/models:ro
    tmpfs:
      - /tmp/background-removal:size=2g,mode=1770,uid=999,gid=999
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    read_only: true
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 20s
      timeout: 5s
      retries: 5

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=8m
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  redis-data:
  object-data:
